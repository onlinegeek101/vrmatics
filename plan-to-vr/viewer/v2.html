  if (has('SOFA') || has('SECT') || has('COUCH') || has('LOVE')) add('sofa', 'seating');
  if (has('CHAIR') || has('RECLIN') || has('STOOL')) add('chair', 'seating');
  if (has('TABLE') || has('DESK') || has('COFFEE')) add('table', 'seating');
  if (has('BED')) add('bed');
  if (has('DRAWN')) add('seating', 'table');
  if (has('FRIDGE') || has('REFRIG')) add('fridge');
  if (has('RANGE') || has('STOVE') || has('OVEN') || has('COOK')) add('range');
  if (has('DISHWASH')) add('dishwasher');
  if (has('WASHER') && !has('DISHWASH')) add('washer');
  if (has('DRYER')) add('dryer');
  if (has('TOILET') || has('WC')) add('toilet');
  if (has('SHOWER')) add('shower');
  if (has('TUB') || has('BATHTUB')) add('tub', 'shower');
  if (has('VANITY') || has('SINK') || has('LAV')) add('sink', 'vanity');

}

// ---------------------------------------------------------------- 2D blueprint (no extrusion)
// Draws the raw DXF entities as flat linework, colour-coded by stage, respecting the

  const seg = (arr, a, b) => arr.push(new THREE.Vector3(wx(a[0]), 0, wz(a[1])), new THREE.Vector3(wx(b[0]), 0, wz(b[1])));

// ---------------------------------------------------------------- DXF parse
// Minimal reader for the entities this pipeline uses: LINE, LWPOLYLINE, TEXT.
// Groups the ENTITIES section by layer; keeps color (62) + polyline elevation

      ents.push(cur);

    else if (code === '38') cur.elev = parseFloat(val);
    else if (code === '1') cur.text = val;
    else if (code === '40') cur.h = parseFloat(val);
    else if (code === '50') cur.a0 = parseFloat(val);
    else if (code === '51') cur.a1 = parseFloat(val);
    else if (code === '41') cur.p0 = parseFloat(val);
    else if (code === '42') cur.p1 = parseFloat(val);

function boxBetween(x1, z1, x2, z2, th, y0, y1, m) {
  const dx = x2 - x1, dz = z2 - z1, len = Math.hypot(dx, dz);
  const g = new THREE.BoxGeometry(len, (y1 - y0), th * IN2M);
  const mesh = new THREE.Mesh(g, m);

  mesh.rotation.y = -Math.atan2(dz, dx);
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}

  if (has('CHAIR') || has('RECLIN') || has('STOOL')) add('chair', 'seating');
  if (has('STOOL')) add('stool');
  if (has('NIGHTSTAND') || has('BEDSIDE')) add('nightstand');
  if (has('TABLE') || has('DESK') || has('COFFEE')) add('table', 'seating');
  if (has('BED')) add('bed');
  if (has('DRAWN')) add('seating', 'table');
  if (has('FRIDGE') || has('REFRIG')) add('fridge');
  if (has('RANGE') || has('STOVE') || has('OVEN') || has('COOK')) add('range');
  if (has('DISHWASH')) add('dishwasher');

    const shape = new THREE.Shape(r.pts.map(([x, y]) => new THREE.Vector2(wx(x), -wz(y))));

// ---------------------------------------------------------------- 2D blueprint (no extrusion)
// Draws the raw DXF entities as flat linework, colour-coded by stage, respecting the
// same layer toggles. Top-down orthographic — a live blueprint of what feeds the 3D.

// ones — T-junctions — pairs piece by piece instead of skewing), (3) drop stray single

    x.font = F0; let w = x.measureText(lines[0]).width; x.font = F1; for (const l of lines.slice(1)) w = Math.max(w, x.measureText(l).width);
    c.width = Math.ceil(w) + 56; c.height = 30 + 72 + (lines.length - 1) * 56;
    x.fillStyle = 'rgba(255,248,225,0.95)'; x.beginPath(); x.roundRect ? x.roundRect(3, 3, c.width - 6, c.height - 6, 26) : x.rect(3, 3, c.width - 6, c.height - 6); x.fill();
    x.lineWidth = 6; x.strokeStyle = '#ffb000'; x.stroke(); x.textBaseline = 'middle';
    x.font = F0; x.fillStyle = '#1b2330'; x.fillText(lines[0], 28, 15 + 36);
    x.font = F1; x.fillStyle = '#3a4658'; lines.slice(1).forEach((l, i) => x.fillText(l, 28, 15 + 72 + 28 + i * 56));
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    const H = (4.5 * c.height / 102) * IN2M, m = new THREE.Mesh(new THREE.PlaneGeometry(H * c.width / c.height, H), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, toneMapped: false }));
    let a = L.ang;                                     // text runs along the dimension; its top points away from you
    if ((-Math.sin(a)) * (L.x - hx) + Math.cos(a) * (L.y - hy) < 0) a += Math.PI;
    m.rotation.set(-Math.PI / 2, 0, a); m.position.set(wx(L.x), L.lv * IN2M + 0.012, wz(L.y));

  }

  while (measureGroup.children.length > 12) measureGroup.remove(measureGroup.children[0]);
}

// ---------------------------------------------------------------- GitHub issue button
// Connect with #feedback=TOKEN@owner/repo[@branch] in the URL; then ⚑ files an issue
// with a screenshot + where you're standing (matches v1's flag button).
function feedbackCfg() { try { return JSON.parse(localStorage.getItem('plan2vr-feedback')); } catch (e) { return null; } }
(function initFeedback() {
  const m = location.hash.match(/feedback=([^@#&]+)@([\w.-]+)\/([\w.-]+?)(?:@([\w./-]+))?(?:[#&]|$)/);
  if (!m) return;
  localStorage.setItem('plan2vr-feedback', JSON.stringify({ token: m[1], owner: m[2], repo: m[3], branch: m[4] || 'main' }));
  history.replaceState(null, '', location.pathname + location.search);
})();
async function ghPut(path, bytes, msg) {
  const c = feedbackCfg(); if (!c) return false;
  let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`, {
    method: 'PUT', headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' },
    body: JSON.stringify({ message: msg, content: btoa(s), branch: c.branch }) });
  return r.ok;
}
async function ghIssue(title, body) {
  const c = feedbackCfg(); if (!c) return null;
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/issues`, {
    method: 'POST', headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' },
    body: JSON.stringify({ title, body }) });
  if (!r.ok) return null; try { return (await r.json()).number || true; } catch (e) { return true; }
}
let issueBusy = false;
async function fileIssue(text) {
  const c = feedbackCfg();
  if (!c) { alert('Connect a repo first — open the viewer with #feedback=TOKEN@owner/repo in the URL.'); return null; }
  if (issueBusy) return null; issueBusy = true;
  try {
    renderer.render(scene, camera);
    const jpeg = renderer.domElement.toDataURL('image/jpeg', 0.85);
    const bin = atob(jpeg.split(',')[1]), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const cam = new THREE.Vector3(); camera.getWorldPosition(cam);
    const px = +(cam.x / IN2M).toFixed(1), py = +(-cam.z / IN2M).toFixed(1);
    const planName = (DXF.split('/').pop() || 'plan').replace(/\.(json|dxf)$/, '');
    const tag = new Date().toISOString().replace(/[:.]/g, '-');
    const okShot = await ghPut(`vr-notes/issues/shot-${tag}.jpg`, bytes, `v2 issue screenshot ${tag}`);
    const num = await ghIssue(`[v2 issue] ${planName} @ (${px}, ${py})`,
      `**Plan:** \`${planName}\` · standing at (${px}, ${py}) plan-inches\n\n` +
      (text ? text + '\n\n' : '') +
      (okShot ? `![view](https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch}/vr-notes/issues/shot-${tag}.jpg)\n` : '') +
      `\n_Filed from the plan-to-vr v2 walkthrough._`);
    alert(num ? `Issue ${typeof num === 'number' ? '#' + num + ' ' : ''}filed.` : 'Issue failed — check the connection.');
    return num;
  } catch (e) { alert('Issue failed: ' + e.message); return null; }
  finally { issueBusy = false; }
}
// ---------------------------------------------------------------- session notes
// Record the view + mic to a webm you can keep. (In VR the page canvas is what
// captureStream sees; audio always records.)
const noteRec = { active: false, rec: null, chunks: [], stream: null };
async function startNote() {
  if (noteRec.active) return;
  let audio = null;
  try { audio = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) {}
  const mt = ['video/webm;codecs=vp8,opus', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mt) { alert('Recording is not supported in this browser.'); return; }
  const cs = canvas.captureStream(30);
  noteRec.stream = new MediaStream([...cs.getVideoTracks(), ...(audio ? audio.getAudioTracks() : [])]);
  noteRec.chunks = [];
  try { noteRec.rec = new MediaRecorder(noteRec.stream, { mimeType: mt, videoBitsPerSecond: 2500000 }); }
  catch (e) { alert('Recorder failed: ' + e.message); return; }
  noteRec.rec.ondataavailable = e => { if (e.data.size) noteRec.chunks.push(e.data); };
  noteRec.rec.start(1000); noteRec.active = true;
  noteBtn.textContent = '⏹ stop'; noteBtn.style.background = '#b03030';
}
function stopNote() {
  if (!noteRec.active) return; noteRec.active = false;
  noteBtn.textContent = '⏺ note'; noteBtn.style.background = '#3a6a3a';
  noteRec.rec.onstop = () => {
    const blob = new Blob(noteRec.chunks, { type: noteRec.rec.mimeType });
    const url = URL.createObjectURL(blob);
    const planName = (DXF.split('/').pop() || 'plan').replace(/\.(json|dxf)$/, '');
    const a = document.createElement('a'); a.href = url;
    a.download = `note-${planName}-${new Date().toISOString().replace(/[:.]/g, '-')}.webm`;
    a.click(); setTimeout(() => URL.revokeObjectURL(url), 10000);
    if (noteRec.stream) noteRec.stream.getTracks().forEach(t => t.stop());
  };
  noteRec.rec.stop();
}
const noteBtn = document.createElement('button');
noteBtn.textContent = '⏺ note'; noteBtn.className = 'hud-btn'; noteBtn.style.background = '#3a6a3a';
noteBtn.title = 'record a view + voice note (saves a webm)';
hud.appendChild(noteBtn);
noteBtn.onclick = () => noteRec.active ? stopNote() : startNote();

const issueBtn = document.createElement('button');
issueBtn.textContent = '⚑ issue'; issueBtn.className = 'hud-btn'; issueBtn.style.background = '#7a2b3a';
issueBtn.title = 'file a GitHub issue from right here';
hud.appendChild(issueBtn);
issueBtn.onclick = () => { const t = prompt('Describe the issue (optional):') || ''; fileIssue(t); };
